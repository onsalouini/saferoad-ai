# Déploiement sur Render (https://render.com) : « New > Blueprint » puis choisir ce dépôt.
# Les secrets (JWT_SECRET, ANTHROPIC_API_KEY, SMTP_*, MONGO_URI…) se saisissent dans le tableau de bord.
# Le modèle (ml/models/saferoad_model.pkl, non versionné) doit être fourni : disque persistant
# monté sur /app/ml/models, ou téléchargement au démarrage (MODEL_URL, voir README).
services:
  - type: web
    name: saferoad-api
    runtime: docker
    dockerfilePath: api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: models
      mountPath: /app/ml/models
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none          # frontend et API sur deux sous-domaines différents
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false          # ex. https://saferoad-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VAPID_CONTACT
        sync: false
      - key: VAPID_PRIVATE_KEY_FILE
        value: /app/ml/models/vapid_private.pem   # sur le disque persistant : les abonnements push survivent

  - type: web
    name: saferoad-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # ex. https://saferoad-api.onrender.com
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
